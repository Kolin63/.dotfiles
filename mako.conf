# makoctl reload

[app-name=volctl]
layer=overlay
history=0
anchor=top-right
# Group all volume notifications together
group-by=app-name
# Hide the group-index
format=<b>%s</b>\n%b

[app-name=volume group-index=0]
# Only show last notification
invisible=0


[app-name=power]
layer=overlay
history=0
anchor=top-right
# Group all power notifications together
group-by=app-name
# Hide the group-index
format=<b>%s</b>\n%b

[app-name=power group-index=0]
# Only show last notification
invisible=0
